stash:()=&gt;`&lt;h3&gt;Manage stashes&lt;/h3&gt;${row(&#x27;stash@{0} · Cache experiment&#x27;,&#x27;7c41a10&#x27;)}${row(&#x27;stash@{1} · Before refactor&#x27;,&#x27;0b814c2&#x27;)}&lt;p&gt;Selected: stash@{0} · Cache experiment&lt;/p&gt;&lt;p&gt;Apply retains the entry. Pop removes it only after a conflict-free apply.&lt;/p&gt;&lt;div class=&quot;viz-row&quot;&gt;${btn(&#x27;Apply · conflict scenario&#x27;,&#x27;stash-conflict&#x27;,true)}${btn(&#x27;Pop · conflict scenario&#x27;,&#x27;stash-conflict&#x27;)}${btn(&#x27;Drop…&#x27;,&#x27;stash-drop&#x27;)}&lt;/div&gt;${stashConflict?&#x27;&lt;div class=&quot;card&quot;&gt;&lt;p role=&quot;alert&quot;&gt;Stash apply conflicted · 1 unmerged path.&lt;/p&gt;&lt;p&gt;stash@{0} is retained. Resolve and stage the working file. There is no sequencer Continue or Abort for this stash apply.&lt;/p&gt;&#x27;+go(&#x27;Inspect in Local Changes&#x27;,&#x27;stage&#x27;,true)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;div id=&quot;gg-stash-detail&quot;&gt;&lt;/div&gt;`,

rewrite:()=&gt;`&lt;h3&gt;Reorder and squash to HEAD&lt;/h3&gt;&lt;p&gt;Linear range · 3 commits · oldest first&lt;/p&gt;${row(&#x27;1 · Pick · Add cache metrics&#x27;,&#x27;7d212b3&#x27;)}${row(&#x27;2 · Pick · Refine cache key&#x27;,&#x27;91a4c20&#x27;)}${row(&#x27;3 · Squash into row above · Handle cache invalidation&#x27;,&#x27;a4e72f1&#x27;)}&lt;p&gt;Review example: the last commit will combine into Refine cache key. The first row stays Pick; every commit appears once.&lt;/p&gt;&lt;p&gt;A private backup ref is saved before rewriting. Rewritten commit IDs change.&lt;/p&gt;&lt;label class=&quot;form-check&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;form-check-input&quot;&gt;&lt;span class=&quot;form-check-label&quot;&gt;Automatically stash working changes&lt;/span&gt;&lt;/label&gt;&lt;p&gt;${btn(&#x27;Rewrite · simulate progress&#x27;,&#x27;rewrite&#x27;,true)}&lt;/p&gt;&lt;div id=&quot;gg-rewrite-progress&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;`,
