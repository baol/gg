<!-- Purpose: explore gg user-flow mockups using fictional, local-only state. -->
<div id="gg-flows">
  <div class="viz-controls">
    <label class="form-label">Flow / screen <select class="form-select" id="gg-screen"></select></label>
    <label class="form-check"><input class="form-check-input" type="checkbox" id="gg-narrow"><span class="form-check-label">Narrow layout</span></label>
  </div>
  <div class="viz-row"><span class="viz-badge" id="gg-phase"></span><span id="gg-flow-label"></span></div>
  <hr>
  <div class="gg-product" id="gg-product">
    <header class="gg-toolbar"><strong>gg · good git</strong><span>Repository</span><span>Refs</span><span>View</span><span>Stash</span><span>Actions</span><span>Help</span><code>atlas · feature/cache</code></header>
    <div class="gg-body">
      <aside class="gg-sidebar"><div>Navigation</div><button class="btn btn-ghost btn-block" data-go="stage">Local Changes · 3</button><button class="btn btn-ghost btn-block" data-go="history">All Commits</button><hr><div>Branches</div><p>✓ feature/cache</p><p>main</p><p>release/1.4</p><hr><div>Remotes</div><p>origin/main</p><p>origin/feature/cache</p><hr><span class="text-small">Tracking origin/feature/cache<br>2 ahead · 1 behind</span></aside>
      <main id="gg-content"></main>
    </div>
    <footer class="gg-status" aria-live="polite" id="gg-status">Ready · illustrative data · no Git operations</footer>
  </div>
</div>
<style>
#gg-flows {color:var(--foreground);--gg-add:color-mix(in srgb,var(--green) 13%,transparent);--gg-del:color-mix(in srgb,var(--red) 13%,transparent)}
#gg-flows .gg-toolbar {display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border)}
#gg-flows .gg-toolbar code {margin-inline-start:auto}
#gg-flows .gg-body {display:grid;grid-template-columns:175px minmax(0,1fr);min-height:490px}
#gg-flows .gg-sidebar {padding:18px 14px 16px 0;border-right:1px solid var(--border)}
#gg-flows .gg-sidebar p {margin:12px 0;overflow-wrap:anywhere}
#gg-flows main {min-width:0;padding:18px}
#gg-flows .gg-status {border-top:1px solid var(--border);padding:12px 0;overflow-wrap:anywhere;min-height:44px}
#gg-flows .gg-split {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:18px}
#gg-flows .gg-code {font-family:monospace;margin:16px 0;overflow-wrap:anywhere;white-space:pre-wrap}
#gg-flows .gg-line {padding:6px 8px;display:block}
#gg-flows .gg-add {background:var(--gg-add)}
#gg-flows .gg-del {background:var(--gg-del)}
#gg-flows .gg-selected {background:var(--accent);color:var(--accent-foreground)}
#gg-flows .gg-label {display:block;margin-bottom:12px;overflow-wrap:anywhere}
#gg-flows .gg-file {display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere;flex-wrap:wrap}
#gg-flows .gg-flow {margin-bottom:16px;overflow-wrap:anywhere}
#gg-flows .gg-image {aspect-ratio:4 / 3;background:var(--muted);display:grid;place-items:center;color:var(--foreground)}
#gg-flows .gg-image div {background:var(--accent);color:var(--accent-foreground);padding:24px}
#gg-flows code {overflow-wrap:anywhere;white-space:normal}
#gg-flows .gg-product.narrow {max-width:510px;margin:auto}
#gg-flows .narrow .gg-body {grid-template-columns:minmax(0,1fr)}
#gg-flows .narrow .gg-sidebar {display:none}
#gg-flows .narrow .gg-split {grid-template-columns:minmax(0,1fr)}
#gg-flows .narrow main {padding:18px 0}
#gg-flows .narrow .gg-toolbar code {margin:0}
#gg-flows .gg-pane-tabs {display:none}
#gg-flows .narrow .gg-pane-tabs {display:flex}
#gg-flows .narrow .gg-hide-pane {display:none}
@media(max-width:650px){#gg-flows .gg-body{grid-template-columns:minmax(0,1fr)}#gg-flows .gg-sidebar{display:none}#gg-flows .gg-split{grid-template-columns:minmax(0,1fr)}#gg-flows main{padding:18px 0}#gg-flows .gg-pane-tabs{display:flex}#gg-flows .gg-hide-pane{display:none}}
</style>
<script>
(() => {
const root=document.getElementById('gg-flows');
const q=s=>root.querySelector(s);
const screens=[['history','History','F01 · Find a commit','Existing'],['review','Review','F02 · Inspect a comparison','Existing'],['reading','Reading','F02 · Read the complete file','Existing'],['stage','Stage','F03 · Build a commit','Existing'],['discard','Discard','F04 · Confirm exact scope','Existing'],['hook','Hook failure','F03 · Recover a blocked commit','Existing'],['branch','Branch','F05 · Switch with local changes','Existing'],['network','Network','F06 · Push and retry','Existing'],['stash','Stash','F07 · Restore parked work','Existing'],['integrate','Integrate','F08 · Merge into current branch','Existing'],['conflicts','Conflicts','F09 · Resolve and continue','Existing'],['rewrite','Rewrite','F10 · Reorder and squash','Existing'],['recovery','Recovery','F10 · Recover a saved tip','Existing'],['filehistory','File history','F11 · Navigate content versions','M7 · existing'],['blame','Blame','F12 · Trace a line or range','M7 · proposed'],['images','Images','F13 · Compare image versions','M7 · proposed'],['worktrees','Worktrees','F14 · Isolate work contexts','M7 · proposed'],['submodule','Submodule','F15 · Inspect nested state','M7 · proposed'],['lfs','LFS','F16 · Fetch content explicitly','M7 · proposed'],['signing','Signing','F17 · Separate validity and trust','M7 · proposed']];
const saved=window.openai?.widgetState?.privateContent;
let screen=screens.some(x=>x[0]===saved?.screen)?saved.screen:'history';
let staged=false,resolved=false,version=0,choice=false,chosen=false,network='rejected',lfs=false,stashConflict=false,split=false,pane='unstaged',conflictSide='ours';
let draft='Handle cache invalidation';
const btn=(label,action,primary=false,disabled=false)=>`<button type="button" class="btn${primary?' btn-primary':''}" data-act="${action}"${disabled?' disabled':''}>${label}</button>`;
const go=(label,target,primary=false)=>`<button type="button" class="btn${primary?' btn-primary':''}" data-go="${target}">${label}</button>`;
const row=(a,b)=>`<div class="gg-file"><span>${a}</span><span>${b}</span></div>`;
const code=(full=false)=>`<div class="gg-code"><span class="gg-line"> 41  fn load_cache(key: &amp;str) {</span>${full?'': '<span class="gg-line gg-del">−42    cache.get(key)</span>'}<span class="gg-line gg-add">+42    cache.invalidate(key);</span><span class="gg-line gg-add">+43    cache.get_fresh(key)</span><span class="gg-line"> 44  }</span></div>`;
const direction='<p class="text-small">Before <code>main · 91a4c20</code> → After <code>feature/cache · a4e72f1</code></p>';
const panels={
history:()=>`<h3>All Commits</h3><label class="form-label">Filter history<input class="form-control" id="gg-filter" placeholder="Subject, author, or hash"></label><div id="gg-commits">${row('● feature/cache · Handle cache invalidation','a4e72f1 · Avery')}${row('│ ● origin/main · Refine cache key','91a4c20 · Jules')}${row('● Add cache metrics','7d212b3 · Avery')}</div><p>${go('Review selected commit','review',true)} ${go('Commit actions: rewrite','rewrite')}</p>`,
review:()=>`<div class="viz-row">${go('Back to history','history')}<h3>Handle cache invalidation</h3></div>${direction}<p>Parent 1 of 1 · 3 changed files · +18 −7</p>${row('M · src/cache.rs',go('Read file','reading',true))}${row('M · tests/cache.rs','+8 −2')}${row('M · assets/cache.png',go('Image comparison · proposed','images'))}<p class="text-small">For a merge, choose the comparison parent here. Root commits use the empty tree.</p>`,
reading:()=>`<div class="viz-row">${go('Back to files','review')}<h3>src/cache.rs</h3>${go('History','filehistory')}${go('Blame · proposed','blame')}</div>${direction}<div class="viz-controls">${btn('Diff','diff',false)}${btn('Full file','full',true)}<span>After · 1.2 KiB</span></div><div class="viz-row"><span>File 1 of 3</span><span>Change 1 of 1</span>${btn('Prev change','noop',false,true)}${btn('Next change','noop',false,true)}</div><div id="gg-reader">${code(true)}</div><p class="text-small">Line 42 · After side · H: history · B: blame (planned) · Esc: files</p>`,
stage:()=>`<h3>Local Changes · src/cache.rs</h3><p>Scan complete · 3 paths · Commit writes the index</p><div class="viz-controls gg-pane-tabs">${btn('Staged · '+(staged?'1':'0'),'pane-staged')}${btn('Unstaged · '+(staged?'1':'2'),'pane-unstaged')}${btn(split?'Single pane':'Split','split')}</div><div class="gg-split"><section class="${!split&&pane!=='staged'?'gg-hide-pane':''}"><h3>Staged · ${staged?'1':'0'}</h3><span class="text-small">HEAD → index</span>${staged?code(): '<p>No staged changes.</p>'}${btn('Unstage file','unstage',false,!staged)}</section><section class="${!split&&pane!=='unstaged'?'gg-hide-pane':''}"><h3>Unstaged · ${staged?'1':'2'}</h3><span class="text-small">index → working file</span>${staged?'<p>Selected hunk is staged. Other working edits remain.</p>':code()}<div class="viz-row">${btn('Stage hunk','stage',true,staged)}${go('Discard file…','discard')}</div></section></div><hr><label class="form-label">Commit message<textarea class="form-control" id="gg-draft" rows="2"></textarea></label><p id="gg-ready">${staged?'Ready to commit staged changes.':'Stage changes to enable Commit.'}</p><div class="viz-row">${btn('Commit','commit',true,!staged||!draft.trim())}${go('Preview hook failure','hook')}</div>`,
discard:()=>`<h3>Discard working changes?</h3><div class="card"><p><strong>File: src/cache.rs</strong></p><p>Scope: all unstaged changes in this tracked file.</p><p>Restore working content from the index. The index and staged changes are unchanged.</p><div class="viz-row">${go('Cancel','stage')}${btn('Discard file','discard')}</div></div>`,
hook:()=>`<h3>Commit blocked by pre-commit</h3><p role="alert">Formatting check failed. No commit was published.</p><div class="gg-code">src/cache.rs:43 — run formatter before committing</div><p>Your draft and working changes are retained. Status refresh includes any changes made by the hook.</p><div class="viz-row">${btn('Details…','hook-details')}${go('Return to Local Changes','stage',true)}</div><div id="gg-hook-detail"></div>`,
branch:()=>`<h3>Switch to main</h3><p>Current branch: feature/cache</p><div class="card"><p role="alert">Switch blocked: local changes need attention.</p><p>Review and commit, or explicitly stash your work before trying again.</p>${go('Open Local Changes','stage',true)} ${go('Manage stashes','stash')}</div><p class="text-small">Selecting a ref jumps to a commit; switching changes the checked-out branch.</p>`,
network:()=>`<h3>Push feature/cache</h3><p><code>feature/cache → origin/feature/cache</code></p><p>Upstream: origin/feature/cache · non-force push</p><div class="card"><p>${network==='rejected'?'Push rejected: remote contains work you do not have.':network==='pending'?'Pushing… waiting for the remote receipt.':'Push complete · origin/feature/cache updated.'}</p><p>${network==='rejected'?'Fetch explicitly, inspect incoming commits, and integrate before retrying.':network==='pending'?'Other mutation actions are disabled until completion.':'Tracking refreshed. Working files are unchanged.'}</p><div class="viz-row">${network==='rejected'?btn('Details…','network-details')+btn('Retry push','push',true):network==='pending'?btn('Cancel','cancel-push')+btn('Simulate remote success','push-success'):btn('Show rejected scenario','push-reset')}</div><div id="gg-network-detail"></div></div>`,
stash:()=>`<h3>Manage stashes</h3>${row('stash@{0} · Cache experiment','7c41a10')}${row('stash@{1} · Before refactor','0b814c2')}<p>Selected: stash@{0} · Cache experiment</p><p>Apply retains the entry. Pop removes it only after a conflict-free apply.</p><div class="viz-row">${btn('Apply · conflict scenario','stash-conflict',true)}${btn('Pop · conflict scenario','stash-conflict')}${btn('Drop…','stash-drop')}</div>${stashConflict?'<div class="card"><p role="alert">Stash apply conflicted · 1 unmerged path.</p><p>stash@{0} is retained. Resolve and stage the working file. There is no sequencer Continue or Abort for this stash apply.</p>'+go('Inspect in Local Changes','stage',true)+'</div>':''}<div id="gg-stash-detail"></div>`,
integrate:()=>`<h3>Merge branch into feature/cache</h3><label class="form-label">Source ref<select class="form-select"><option>origin/main · 91a4c20</option></select></label><p>Direction: origin/main → current branch feature/cache</p><label class="form-check"><input type="checkbox" class="form-check-input"><span class="form-check-label">Always create a merge commit</span></label><p>Clean-worktree check runs before Git starts. A conflict leaves a recoverable merge in progress.</p><div class="viz-row">${go('Cancel','history')}${go('Merge · conflict scenario','conflicts',true)}</div>`,
conflicts:()=>`<h3>Merge in progress · ${resolved?'0':'1'} unresolved</h3><p>Source: origin/main · 91a4c20</p><div class="viz-row">${btn('Continue merge','continue',true,!resolved)}${btn('Abort merge','abort')}</div><p>${resolved?'All paths staged as resolved. Continue is ready.':'Resolve and stage every path to enable Continue.'}</p><hr><h3>src/cache.rs</h3><div class="viz-controls gg-pane-tabs">${btn('Ours · current branch','conflict-ours')}${btn('Theirs · incoming branch','conflict-theirs')}</div><div class="gg-split"><section class="${conflictSide!=='ours'?'gg-hide-pane':''}"><h3>Ours · feature/cache</h3><p>Current branch content</p><div class="gg-code">cache.invalidate(key);</div>${btn('Use ours · replace and stage','resolve',true,resolved)}</section><section class="${conflictSide!=='theirs'?'gg-hide-pane':''}"><h3>Theirs · origin/main</h3><p>Incoming branch content</p><div class="gg-code">cache.refresh(key);</div>${btn('Use theirs · replace and stage','resolve',false,resolved)}</section></div><details><summary>Base · common ancestor</summary><div class="gg-code">cache.get(key);</div></details><p>${btn('Stage resolved external edits','resolve',false,resolved)}</p><p class="text-small">Whole-file choices replace and stage. Stage resolved uses your external edits. A merge has no Skip.</p>`,
rewrite:()=>`<h3>Reorder and squash to HEAD</h3><p>Linear range · 3 commits · oldest first</p>${row('1 · Pick · Add cache metrics','7d212b3')}${row('2 · Pick · Refine cache key','91a4c20')}${row('3 · Squash into row above · Handle cache invalidation','a4e72f1')}<p>Review example: the last commit will combine into Refine cache key. The first row stays Pick; every commit appears once.</p><p>A private backup ref is saved before rewriting. Rewritten commit IDs change.</p><label class="form-check"><input type="checkbox" class="form-check-input"><span class="form-check-label">Automatically stash working changes</span></label><p>${btn('Rewrite · simulate progress','rewrite',true)}</p><div id="gg-rewrite-progress" aria-live="polite"></div>`,
recovery:()=>`<h3>Backups</h3><p>Private recovery refs stay out of the refs sidebar.</p>${row('Rewrite · Handle cache invalidation','a4e72f1')}<p><code>refs/gg/backup/rewrite/20261025-101500</code></p><p>Saved commit time: 2026-10-24 14:32 UTC</p><div class="viz-row">${go('Open commit','review')}${btn('Create branch here…','recover',true)}</div><div id="gg-recover-form"></div><p class="text-small">Reset recovery requires mode and target confirmation; Hard warns about staged and working changes.</p>`,
filehistory:()=>`<div class="viz-row">${go('Back to file','reading')}<h3>File history · src/cache.rs</h3></div><div class="viz-row">${btn('Before · older version','older',false,version===2||choice)}${btn('After · newer version','newer',false,version===0||choice)}<span>Version ${version+1} of 3 · ${version===0?'Newest version':version===2?'Oldest version':'Earlier content'}</span></div><p>${['Modified · a4e72f1 · Handle cache invalidation','Renamed · 91a4c20 · Refine cache key','Added · 7d212b3 · Add cache metrics'][version]}</p><p>Avery Chen · 2026-10-${24-version} · 14:32 UTC</p>${version===1?'<p>Old path: src/store.rs → src/cache.rs</p>':''}<div class="viz-row"><span>Full file · New side</span>${btn('Show ambiguous predecessor','ambiguity')}</div>${choice?'<div class="card"><h3>Choose predecessor</h3><p>Earlier edge unresolved · Diff unavailable until a choice is made.</p>'+btn('Modified · e72a190 · Main cache · Jules · Oct 20 · src/cache.rs','choose')+btn('Renamed · c14b203 · Move store · Avery · Oct 19 · src/store.rs','choose')+'</div>':code(true)}<p class="text-small">${chosen?'Chosen predecessor retained for this edge. ':''}Version navigation is separate from the Old/New inspection side. Unchanged commits are skipped.</p>`,
blame:()=>`<div class="viz-row">${go('Back to file','reading')}<h3>Blame · src/cache.rs</h3></div><p>Revision a4e72f1 · selected After lines 42–43</p><div class="gg-code"><span class="gg-line">7d212b3 · Avery · Oct 22 │41 fn load_cache(key: &amp;str) {</span><span class="gg-line gg-selected">a4e72f1 · Avery · Oct 24 │42   cache.invalidate(key);</span><span class="gg-line gg-selected">a4e72f1 · Avery · Oct 24 │43   cache.get_fresh(key)</span><span class="gg-line">7d212b3 · Avery · Oct 22 │44 }</span></div><p>Selected origin: a4e72f1 · Handle cache invalidation</p><div class="viz-row">${go('Line history','filehistory',true)}${go('Open origin commit','review')}</div><p class="text-small">Proposed: history keeps the range anchor; divergent predecessor mappings require a chooser.</p>`,
images:()=>`<h3>assets/cache.png</h3>${direction}<p>Side by side · Fit · transparency retained</p><div class="gg-split"><section><h3>Before</h3><p>800 × 600 · 42 KiB</p><div class="gg-image" role="img" aria-label="Illustrative before image: Cache label"><div>Cache</div></div></section><section><h3>After</h3><p>800 × 600 · 45 KiB</p><div class="gg-image" role="img" aria-label="Illustrative after image: Fresh cache label"><div>Fresh cache</div></div></section></div><p class="text-small">Illustrative image placeholders. Proposed swipe, actual-size zoom, and export flows are detailed in F13.</p>`,
worktrees:()=>`<h3>Worktrees</h3>${row('Current · feature/cache','/work/atlas · 3 changed paths')}${row('main · clean','/work/atlas-main')}${row('release/1.4 · locked','/work/atlas-release')}<p>${btn('Open main worktree','worktree',true)}</p><p>Opening saves this worktree’s draft and selection. The destination restores only its own state.</p><p class="text-small">Proposed: create validates branch availability; dirty removal is blocked; clean removal confirms the exact path.</p>`,
submodule:()=>`<h3>Submodule · vendor/parser</h3>${row('Parent-recorded commit','82e41c0')}${row('Nested checked-out commit','d714ba0')}${row('State','Initialized · 2 modified files')}<p role="alert">Update blocked: nested working changes need attention.</p><p>Updating must explicitly name 82e41c0 as the destination. Opening details does not initialize, update, or stage the parent gitlink.</p>${btn('Inspect nested repository','nested',true)} ${btn('Update to recorded commit','noop',false,true)}<div id="gg-nested"></div>`,
lfs:()=>`<h3>LFS · assets/model.bin</h3><span class="gg-label">Pointer object identity</span><code>sha256:3a47cb192df04ce3c048d672e29f580e31c0b12d99e47f850dce8132a5ba9041</code><p>Declared object size: 84 MiB</p><p>Local content: ${lfs?'Available · preview exceeds budget':'Unavailable · showing pointer identity'}</p><p>Remote: origin · reading this file does not download content.</p>${btn(lfs?'Object available':'Fetch object · 84 MiB','fetch-lfs',true,lfs)}<p class="text-small">Fetching does not materialize a working file. A smudge action requires a separate explicit decision.</p>`,
signing:()=>`<h3>Signature details · a4e72f1</h3>${row('Object','Commit · Handle cache invalidation')}${row('Format','SSH')}${row('Cryptographic verification','Valid signature')}${row('Signer identity','avery@example.test')}${row('Trust','Unknown · key not in configured allowed signers')}<p><code>SHA256:uXrEjR2DacG2rJq7CzH3a5V4B2sY9k0F6nQpL8oM1wA</code></p><p>A valid signature does not establish trusted identity. Verification does not modify signing or trust configuration.</p>${btn('Verification details','signature-details')}<div id="gg-signature"></div>`
};
q('#gg-screen').innerHTML=screens.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
function status(t){q('#gg-status').textContent=t;}
function persist(){window.openai?.setWidgetState?.({modelContent:{screen,narrow:q('#gg-narrow').checked},privateContent:{screen,narrow:q('#gg-narrow').checked}})?.catch(()=>{});}
function render(){let item=screens.find(x=>x[0]===screen);q('#gg-screen').value=screen;q('#gg-phase').textContent=item[3];q('#gg-flow-label').textContent=item[2];q('#gg-content').innerHTML=panels[screen]();if(screen==='stage')q('#gg-draft').value=draft;status('Mockup · '+item[1]+' · no Git operations');}
q('#gg-screen').onchange=e=>{screen=e.target.value;render();persist();};
q('#gg-narrow').checked=!!saved?.narrow;
q('#gg-product').classList.toggle('narrow',q('#gg-narrow').checked);
q('#gg-narrow').onchange=e=>{q('#gg-product').classList.toggle('narrow',e.target.checked);persist();};
root.addEventListener('input',e=>{if(e.target.id==='gg-draft'){draft=e.target.value;q('[data-act="commit"]').disabled=!staged||!draft.trim();q('#gg-ready').textContent=!staged?'Stage changes to enable Commit.':!draft.trim()?'Enter a commit message.':'Ready to commit staged changes.';}if(e.target.id==='gg-filter'){const term=e.target.value.toLowerCase();let rows=[...q('#gg-commits').children];rows.forEach(el=>el.hidden=!el.textContent.toLowerCase().includes(term));status(rows.some(el=>!el.hidden)?'Filtered history · read-only':'No matching commits · change the filter');}});

root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){screen=b.dataset.go;render();persist();return;}const a=b.dataset.act;if(a==='stage'){staged=true;pane='staged';render();status('Hunk staged · both comparisons refreshed');}if(a==='unstage'){staged=false;pane='unstaged';render();}if(a==='pane-staged'||a==='pane-unstaged'){pane=a.slice(5);split=false;render();}if(a==='split'){split=!split;render();}if(a==='commit'){staged=false;draft='';render();status('Commit created · a8f0312 · submitted draft cleared');}if(a==='discard'){screen='stage';render();status('Working file restored from index · staged content unchanged');}if(a==='hook-details')q('#gg-hook-detail').innerHTML='<pre class="gg-code">Hook: pre-commit\nExit status: 1\nFormatting check failed at src/cache.rs:43</pre>';if(a==='diff'||a==='full'){q('#gg-reader').innerHTML=code(a==='full');status(a==='full'?'Full file · After · selected line 42 retained':'Diff · Before → After · selected line 42 retained');}if(a==='push'){network='pending';render();}if(a==='cancel-push'){network='rejected';render();status('Push cancelled · inspect remote state before retry');}if(a==='push-success'){network='success';render();}if(a==='push-reset'){network='rejected';render();}if(a==='network-details')q('#gg-network-detail').textContent='Git rejected a non-fast-forward update. No force push was attempted.';if(a==='stash-conflict'){stashConflict=true;render();}if(a==='stash-drop')q('#gg-stash-detail').innerHTML='<div class="card"><p>Drop stash@{0} · Cache experiment? Working files are unchanged.</p>'+btn('Cancel','stash-cancel')+btn('Drop stash','stash-drop-confirm')+'</div>';if(a==='stash-cancel')q('#gg-stash-detail').textContent='';if(a==='stash-drop-confirm'){q('#gg-stash-detail').textContent='Selected stash removed · working files unchanged (simulation).';b.disabled=true;}if(a==='conflict-ours'||a==='conflict-theirs'){conflictSide=a.slice(9);render();}if(a==='resolve'){resol
