name: Rust
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GG_OFFLINE: "1"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo build -p git-good --release --locked --target ${{ matrix.target }}
      - name: Smoke test release CLI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/git-good"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" history > history.json
          python -c 'import json; data=json.load(open("history.json")); assert data["commits"]'
      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist package
          binary="target/$TARGET/release/git-good"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          cp "$binary" README.md LICENSE package/
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "dist/git-good-$TARGET.zip" ./package/*
          else
            tar -czf "dist/git-good-$TARGET.tar.gz" -C package .
          fi
          python - <<'PYTHON'
          import hashlib
          from pathlib import Path
          for path in Path("dist").iterdir():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              Path(str(path) + ".sha256").write_text(f"{digest}  {path.name}\n")
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: git-good-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: git-good-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          targets = {
              "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin", "aarch64-apple-darwin",
              "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
          }
          expected = set()
          for target in targets:
              extension = "zip" if "windows" in target else "tar.gz"
              name = f"git-good-{target}.{extension}"
              expected.update((name, name + ".sha256"))
              archive = Path("dist") / name
              checksum = Path(str(archive) + ".sha256").read_text().split()
              assert checksum == [hashlib.sha256(archive.read_bytes()).hexdigest(), name], name
          assert {p.name for p in Path("dist").iterdir()} == expected
          PYTHON
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/heads/main ]]; then
            tag="commit-$COMMIT"
            title="Development build ${COMMIT:0:12}"
            options=(--prerelease --latest=false)
          else
            tag="$REF_NAME"
            title="$tag"
            options=(--verify-tag)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --draft=false
          else
            gh release create "$tag" dist/* --target "$COMMIT" \
              --title "$title" --generate-notes "${options[@]}"
          fi
