name: Rust
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.run_id || 'release' }}
  queue: max
  cancel-in-progress: false

env:
  GG_OFFLINE: "1"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: README screenshot matches the UI sources
        run: python3 scripts/capture_native_screenshot.py --check
      - id: version
        run: python3 scripts/release_version.py

  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release_version.py apply "$env:VERSION"
        if: runner.os == 'Windows'
      - name: Apply release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/release_version.py apply "$VERSION"
        if: runner.os != 'Windows'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo build -p git-good --release --locked --target ${{ matrix.target }}
      - name: Smoke test release CLI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          binary="target/$TARGET/release/git-good"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          test "$("$binary" --version)" = "git-good $VERSION"
          "$binary" --cli history > history.json
          python -c 'import json; data=json.load(open("history.json")); assert data["commits"]'
      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist package
          binary="target/$TARGET/release/git-good"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          cp "$binary" README.md LICENSE package/
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "dist/git-good-$TARGET.zip" ./package/*
          else
            tar -czf "dist/git-good-$TARGET.tar.gz" -C package .
          fi
          python - <<'PYTHON'
          import hashlib
          from pathlib import Path
          for path in Path("dist").iterdir():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              Path(str(path) + ".sha256").write_text(f"{digest}  {path.name}\n")
          PYTHON
      - name: Install scripts install the packaged build
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/dev/null 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          for _ in $(seq 50); do
            curl -fs -o /dev/null http://127.0.0.1:8765/ && break
            sleep 0.2
          done
          export GG_DOWNLOAD_URL=http://127.0.0.1:8765
          if [[ "$RUNNER_OS" == Windows ]]; then
            # PowerShell 7 and the Windows PowerShell 5.1 that `irm | iex` may run in.
            for shell in pwsh powershell; do
              dest="$RUNNER_TEMP/gg-install-$shell"
              GG_INSTALL_DIR="$dest" "$shell" -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
              test "$("$dest/git-good.exe" --version)" = "git-good $VERSION"
            done
          else
            dest="$RUNNER_TEMP/gg-install"
            GG_INSTALL_DIR="$dest" sh scripts/install.sh
            test "$("$dest/git-good" --version)" = "git-good $VERSION"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: git-good-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Set in the repository's Actions secrets to publish to crates.io.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: git-good-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          targets = {
              "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin", "aarch64-apple-darwin",
              "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
          }
          expected = set()
          for target in targets:
              extension = "zip" if "windows" in target else "tar.gz"
              name = f"git-good-{target}.{extension}"
              expected.update((name, name + ".sha256"))
              archive = Path("dist") / name
              checksum = Path(str(archive) + ".sha256").read_text().split()
              assert checksum == [hashlib.sha256(archive.read_bytes()).hexdigest(), name], name
          assert {p.name for p in Path("dist").iterdir()} == expected
          PYTHON
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          title="$tag"
          options=()
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse "$COMMIT^{commit}")"
            options+=(--verify-tag)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --draft=false --prerelease=false
          else
            gh release create "$tag" dist/* --target "$COMMIT" \
              --title "$title" --generate-notes "${options[@]}"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: env.CARGO_REGISTRY_TOKEN != ''
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 scripts/release_version.py apply "$VERSION"
          # In dependency order; a version already there (a re-run) is skipped.
          for crate in gg-engine gg-git git-good; do
            if curl -fsS -o /dev/null -A "git-good release (https://github.com/baol/gg)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION is already on crates.io"
              continue
            fi
            # Applying the release version leaves the manifests changed.
            cargo publish -p "$crate" --locked --allow-dirty
          done
