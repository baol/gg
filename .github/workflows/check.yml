name: Check
# Every pull request: one Linux job, a few minutes. The five-platform build
# runs only for a release (ci.yml), so CI fits the Actions allowance.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  GG_OFFLINE: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: README screenshot matches the UI sources
        run: python3 scripts/capture_native_screenshot.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
