# The documentation site, built with Zensical (https://zensical.org).
# Screenshots in docs/assets/screens are rendered from the app by
# scripts/docs_screenshots.py and are not committed; see website/README.md.

[project]
site_name = "Git Good"
site_description = "A fast, native Git desktop app: the History tree, review, hunk and line staging, interactive rebase and recovery."
site_url = "https://baol.github.io/gg/"
repo_url = "https://github.com/baol/gg"
repo_name = "baol/gg"
edit_uri = "edit/main/website/docs/"
copyright = "Apache-2.0 · Git Good contributors"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Get started" = "getting-started.md" },
  { "Workflows" = [
    "workflows/index.md",
    { "Find your way in the History tree" = "workflows/history.md" },
    { "Review a commit" = "workflows/review.md" },
    { "Commit part of your work" = "workflows/commit.md" },
    { "Branches, fetch, pull and push" = "workflows/sync.md" },
    { "Park work in a stash" = "workflows/stash.md" },
    { "Clean up with interactive rebase" = "workflows/rebase.md" },
    { "Resolve a merge conflict" = "workflows/conflicts.md" },
    { "Undo with Recovery" = "workflows/recovery.md" },
    { "Follow a file" = "workflows/file-history.md" },
    { "Tag a release" = "workflows/tags.md" },
    { "Cherry-pick and revert" = "workflows/cherry-pick-revert.md" },
    { "Reset a branch" = "workflows/reset.md" },
    { "Work on two branches at once" = "workflows/worktrees.md" },
    { "Submodules and LFS" = "workflows/submodules-lfs.md" },
    { "Sign commits and tags" = "workflows/signing.md" },
    { "Clone or create a repository" = "workflows/clone-init.md" },
    { "Search, keys and preferences" = "workflows/keyboard.md" },
  ] },
  { "Real use cases" = "use-cases.md" },
  { "Performance" = "performance.md" },
  { "Scripting with the CLI" = "cli.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/baol/gg"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
