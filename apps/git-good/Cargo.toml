[package]
name = "git-good"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
serde.workspace = true
gg-engine.workspace = true
gg-git.workspace = true
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "wayland", "x11"] }
arboard = { version = "3.6", default-features = false }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = { version = "30", default-features = false, features = ["vulkan", "metal", "dx12", "gles"] }
[lints]
workspace = true
