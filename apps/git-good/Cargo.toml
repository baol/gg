[package]
name = "git-good"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
[dependencies]
serde.workspace = true
gg-engine.workspace = true
gg-git.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "wayland", "x11"] }
arboard = { version = "3.6", default-features = false }
rfd = "0.17"
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Checks a system CJK font parses before egui sees it (wide_font.rs); the
# version egui already uses, in Cargo.lock.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = { version = "30", default-features = false, features = ["vulkan", "metal", "dx12", "gles"] }

# The macOS menu bar (mac_menu.rs): muda is a standalone native menu crate
# (from the tauri-apps org, but not Tauri: no webview, no JS), AppKit menus
# behind a safe API. objc2 and objc2-app-kit read AppKit's current event (key
# equivalent or click) and hide the app; already in Cargo.lock. Pinned
# exactly, as photocraft pins them: review the diff before bumping.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.21.2", default-features = false }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder"] }
[dev-dependencies]
# The README screenshot, rendered offscreen (examples/screenshot.rs): no
# display server and no window on the desktop.
egui_kittest = { version = "0.37", features = ["wgpu"] }
[lints]
workspace = true

# The file watcher (watcher.rs). On Linux, inotify directly: notify's inotify
# backend always asks for open events, which slowed every Git command while a
# window watched (RULE-16). Both already in Cargo.lock.
[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
notify = "8"
